name: Security Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ash-scan:
    name: ASH Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run ASH scan
        run: |
          pip install uv
          uvx --from "git+https://github.com/awslabs/automated-security-helper.git" ash --source-dir . --output-dir .ash-output
        continue-on-error: false

      - name: Upload ASH results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ash-results
          path: .ash-output/

  ferret-scan:
    name: Sensitive Data Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Run Ferret scan
        # SHA-pinned TruffleHog action replaces the previous `curl … | sh` install.
        # With base/head unset it scans the full checked-out git history (fetch-depth: 0
        # above); --fail is passed by the action's entrypoint so any finding fails the job.
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check for GPL dependencies
        run: |
          echo "Checking for GPL-licensed dependencies..."
          if find . -name "requirements*.txt" -exec grep -li "GPL" {} \; 2>/dev/null | grep -q .; then
            echo "error: GPL-licensed dependency found" >&2
            exit 1
          fi
          echo "ok: no GPL dependencies detected"
