# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

# ASH security scanning component
# Pinned to v3.0.5 — the internal `code.aws.dev` mirror has its own version
# line (v3.0.x) that does not track upstream awslabs/automated-security-helper.
# v3.0.5 (~2026-04-23) is the version against which our existing
# `cyclonedx: enabled: false` suppression in .ash/ash.yaml was added (2026-04-21)
# and verified working. v3.0.6 (~2026-05-16) appears to backport the upstream
# regression where the new `gitlab-cyclonedx` reporter emits a minimal "empty"
# SBOM that GitLab's parser rejects with "Required GitLab CycloneDX properties
# are missing" — our existing suppression does not cover that new reporter.
# Revisit when we wire up real GitLab dependency scanning, or when the mirror
# exposes a setting to disable the gitlab-cyclonedx reporter.
include:
  - component: code.aws.dev/proserve/automated-security-helper/automated-security-helper/ash@v3.0.5
  - component: code.aws.dev/proserve/genaiid/other/candidate-reusable-assets/code-quality/acq@develop

# Any publicly available python image
image: public.ecr.aws/docker/library/python:3.12-bookworm

stages:
  - test
#   - securityScan  # Inherited
  - deploy
  - release

# AWS credential vendor: the internal code.aws.dev GitLab runner detects the
# AWS_CREDS_TARGET_ROLE variable and vendors short-lived STS credentials for that
# role into the job environment automatically — no id_tokens / assume-role block
# needed. This job verifies the role assumption works before relying on it.
# test:
#   stage: test
#   variables:
#     AWS_CREDS_TARGET_ROLE: arn:aws:iam::369530416671:role/ip-dev-sdlc-GitLab
#     AWS_DEFAULT_REGION: us-east-1
#   script:
#     - aws sts get-caller-identity
#     - aws s3 ls

# GitLab Pages deployment job - must be named "pages" to trigger Pages deployment
# Builds Docusaurus documentation and publishes to https://<namespace>.gitlab.io/<project-name>/
pages:
  stage: deploy
  needs: []
  image: public.ecr.aws/docker/library/node:22-bookworm
  variables:
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "4Gi"
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: "4Gi"
    NODE_OPTIONS: "--max-old-space-size=3072"
  before_script:
    - corepack enable
    # Internal docs (developer-docs/internal/) DO publish to GitLab Pages —
    # this site is internal-only. They are filtered from the GitHub mirror
    # by infra/scripts/github-push.sh EXCLUDE_PATHS, so they never reach
    # GitHub or GitHub Pages.
    - cd docs
    # Uses the pnpm version pinned in docs/package.json "packageManager"
    - pnpm install --frozen-lockfile
  script:
    - pnpm exec docusaurus build
    - mv build ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Stage 1 — internal release. Three jobs whose NAMES are the documentation:
#
#   release:preview  automatic on every push to main, non-blocking, creates
#                    nothing. Shows what the next release would be.
#   release          manual. Derives minor/patch from Conventional Commit
#                    history, tags origin, creates a GitLab Release.
#   release:major    manual, CONFIRM_VERSION-gated. The only way to reach a
#                    major version while the project is pre-1.0.
#
# The version is DERIVED from tags and commit history — there is no VERSION
# file. `git-cliff --bumped-version` is the single source of truth.
#
# Publishing to the public GitHub mirror is stage 2 (`publish:github:*`) and is
# deliberately NOT part of any job here. Cutting an internal release publishes
# nothing publicly.
#
# Why these are manual jobs on a BRANCH pipeline rather than tag-triggered: a
# tag pipeline cannot work here. `pages` requires $CI_COMMIT_BRANCH (unset on
# tag pipelines) and the release jobs require $CI_COMMIT_TAG == null. A manual
# job on a branch pipeline sidesteps both.
# ---------------------------------------------------------------------------
.release-base:
  stage: release
  image: public.ecr.aws/docker/library/python:3.12-bookworm
  variables:
    # Full clone required: version derivation walks history back to the newest
    # release tag, and tag operations need the tag objects themselves. A shallow
    # clone silently derives from the wrong base.
    GIT_DEPTH: "0"
  before_script:
    # Pinned to match the version every mechanism in this pipeline was verified
    # against. git-cliff is not in the base image.
    - pip install --quiet --disable-pip-version-check 'git-cliff==2.10.1'
    - git fetch origin --tags --force
    - git config user.email "ci@code.aws.dev"
    - git config user.name "GitLab CI"

# Automatic, non-blocking preview. Prints the version that would be cut and the
# exact notes that would be published, and creates nothing.
#
# `allow_failure: true` keeps it non-blocking; the derived-equals-latest branch
# below keeps it GREEN when there is simply nothing to release. Both are needed
# — a job that is usually red is a job everyone learns to ignore, at which point
# it also hides the one time it means something.
release:preview:
  extends: .release-base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      allow_failure: true
    - when: never
  needs: []
  script:
    - LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
    - DERIVED=$(git-cliff --bumped-version)
    # Quoted: a bare `: ` in a YAML plain scalar parses as a mapping key.
    - 'echo "current release: $LATEST"'
    - 'echo "would release:   $DERIVED"'
    - |
      if [ "$DERIVED" = "$LATEST" ]; then
        echo ""
        echo "Nothing to release — no commits since $LATEST affect the version."
        echo "Only conventional commits (feat:, fix:, ...) derive a new version."
        exit 0
      fi
    - echo ""
    - echo "--- release notes for $DERIVED ---"
    - git-cliff --unreleased --strip all
    - echo "--- end release notes ---"
    - echo ""
    - echo "To cut this release, run the 'release' job. Nothing has been created."

# Ordinary release: minor and patch. Cannot produce a major bump while pre-1.0
# (cliff.toml sets breaking_always_bump_major = false), so reaching 1.0.0
# requires the separately named release:major job.
release:
  extends: .release-base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: false
    - when: never
  needs:
    - job: ash
      optional: true
  script:
    - TAG=$(git-cliff --bumped-version)
    - LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
    - |
      if [ "$TAG" = "$LATEST" ]; then
        echo "Nothing to release — derived version equals the current tag ($LATEST)."
        echo "Only conventional commits (feat:, fix:, ...) derive a new version."
        exit 1
      fi
    - |
      if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
        echo "error: tag $TAG already exists on origin — nothing to release" >&2
        exit 1
      fi
    - echo "Releasing $TAG"
    # Before tagging: assert tag hygiene and that $TAG is what history derives.
    # Running it after would leave a wrong tag behind on failure.
    - bash infra/scripts/release-check.sh "$TAG"
    # --tag stamps the heading as "## [X.Y.Z] - <date>". Without it the notes are
    # headed "## [Unreleased]", which is wrong on a tag that names a version —
    # and the publish path's heading assertion looks for "## [".
    - git-cliff --unreleased --tag "$TAG" --strip all > /tmp/release-notes.md
    - git tag -a "$TAG" --cleanup=verbatim -F /tmp/release-notes.md
    - git push origin "$TAG"
    - bash infra/scripts/gitlab-release.sh "$TAG" /tmp/release-notes.md
    - echo ""
    - echo "Released $TAG internally. Nothing was published to GitHub."
    - echo "To publish this tag publicly, run 'publish:github:plan' first."

# Major release. Separately named and confirmation-gated because it is one of
# only two irreversible acts in the release path (the other is publishing).
#
# NOTE: breaking_always_bump_major = false is INERT once the major reaches 1.
# After 1.0.0 the ordinary `release` job will coin majors from feat!: commits
# and this job becomes decorative — accepted, since a feat!: commit genuinely
# should mean a major at that point. This job exists for the 0.x -> 1.0
# transition, which is the transition it will actually be used for.
release:major:
  extends: .release-base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: false
    - when: never
  needs:
    - job: ash
      optional: true
  script:
    - TAG=$(git-cliff --bump major --bumped-version)
    # Gate BEFORE anything is created. A gate that fires after tagging is not a gate.
    - |
      if [ "${CONFIRM_VERSION:-}" != "$TAG" ]; then
        echo "error: major release requires explicit confirmation" >&2
        echo "would cut: $TAG" >&2
        echo "hint: re-run this job with CONFIRM_VERSION=$TAG" >&2
        exit 1
      fi
    - echo "Releasing MAJOR $TAG (confirmed)"
    - bash infra/scripts/release-check.sh "$TAG" major
    - git-cliff --bump major --unreleased --tag "$TAG" --strip all > /tmp/release-notes.md
    - git tag -a "$TAG" --cleanup=verbatim -F /tmp/release-notes.md
    - git push origin "$TAG"
    - bash infra/scripts/gitlab-release.sh "$TAG" /tmp/release-notes.md
    - echo ""
    - echo "Released $TAG internally. Nothing was published to GitHub."

# ---------------------------------------------------------------------------
# Stage 2 — public publish. Two jobs:
#
#   publish:github:plan  manual dry run. Prints TAG, FLOOR, the full notes body,
#                        the filtered-path report, and the exact CONFIRM_TAG
#                        value. Publishes nothing.
#   publish:github       manual, CONFIRM_TAG-gated. The one irreversible act in
#                        the release path — it force-pushes a public repository
#                        that has accepted pull requests.
#
# Publishing is deliberately separate from cutting an internal release, so an
# internal release can be cut without going public and an OLDER tag can be
# published later. The floor (what GitHub already has) is resolved from GitHub
# itself, so notes cover every change since the last publish even when several
# internal releases were skipped.
#
# The plan job exists as a NAMED job rather than a DRY_RUN flag so that someone
# publishing for the first time finds it without needing to know a variable name.
# ---------------------------------------------------------------------------
.publish-base:
  stage: release
  image: public.ecr.aws/docker/library/python:3.12-bookworm
  variables:
    # Full clone required on two counts: the publish path unshallows before
    # reasoning about ancestry (a truncated graph answers "not an ancestor" for
    # commits that are), and git's pack negotiation otherwise references objects
    # past the shallow boundary, which GitHub rejects.
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: false
    - when: never
  before_script:
    - pip install --quiet --disable-pip-version-check 'git-cliff==2.10.1'
    # $GITHUB_DEPLOY_KEY is base64-encoded (masked + protected CI variable).
    # It lives on the publish jobs only — stage 1 never touches GitHub.
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - eval $(ssh-agent -s)
    - |
      DECODED_LEN=$(printf '%s' "$GITHUB_DEPLOY_KEY" | base64 -di 2>/dev/null | wc -c || true)
      if [ "${DECODED_LEN:-0}" -lt 200 ]; then
        echo "ERROR: GITHUB_DEPLOY_KEY decodes to only ${DECODED_LEN:-0} bytes." >&2
        exit 1
      fi
    - printf '%s' "$GITHUB_DEPLOY_KEY" | base64 -di | ssh-add -
    - mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git fetch origin --tags --force

# Dry run. Set TAG to publish something other than the newest internal tag.
publish:github:plan:
  extends: .publish-base
  needs: []
  script:
    - bash internal/release/publish-github.sh --dry-run ${TAG:-}

# The irreversible act. Requires CONFIRM_TAG to equal the tag being published;
# run publish:github:plan first to learn the value.
publish:github:
  extends: .publish-base
  needs: []
  script:
    - bash internal/release/publish-github.sh ${TAG:-}
