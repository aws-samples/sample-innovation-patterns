# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

# ASH security scanning component
# Pinned to v3.0.5 — the internal `code.aws.dev` mirror has its own version
# line (v3.0.x) that does not track upstream awslabs/automated-security-helper.
# v3.0.5 (~2026-04-23) is the version against which our existing
# `cyclonedx: enabled: false` suppression in .ash/ash.yaml was added (2026-04-21)
# and verified working. v3.0.6 (~2026-05-16) appears to backport the upstream
# regression where the new `gitlab-cyclonedx` reporter emits a minimal "empty"
# SBOM that GitLab's parser rejects with "Required GitLab CycloneDX properties
# are missing" — our existing suppression does not cover that new reporter.
# Revisit when we wire up real GitLab dependency scanning, or when the mirror
# exposes a setting to disable the gitlab-cyclonedx reporter.
include:
  - component: code.aws.dev/proserve/automated-security-helper/automated-security-helper/ash@v3.0.5
  - component: code.aws.dev/proserve/genaiid/other/candidate-reusable-assets/code-quality/acq@develop

# Any publicly available python image
image: public.ecr.aws/docker/library/python:3.12-bookworm

stages:
  - test
#   - securityScan  # Inherited
  - deploy
  - release

# ---------------------------------------------------------------------------
# Integration test on CodeBuild — two MANUAL jobs, run from the GitLab UI.
#
#   integration-test:start   manual. Zips this checkout, uploads it as the
#                            pipeline's source, starts ONE execution and returns
#                            in about a minute. BILLABLE — see the cost note.
#   integration-test:watch   manual, free. Polls the latest execution until it
#                            finishes. Separate from `start` so that a run
#                            outliving the job timeout is a re-clickable poll
#                            rather than a lost result.
#
# Both call the SAME targets a maintainer runs by hand
# (internal/infra/codepipeline/Makefile), deliberately: a CI-only code path that
# re-implements archive/upload/start is one that drifts from the stack it drives.
# `make start` needs CONFIRM=1 there, and it is passed here — the guard exists to
# stop an accidental laptop run, and clicking a job named "start" IS the confirm.
#
# WHAT THIS COSTS, because clicking is cheap and the run is not: LARGE CodeBuild
# minutes up to the stack's BuildTimeoutMinutes ceiling, model spend, and every
# stack the test itself deploys until its teardown runs. Which of those applies
# is fixed by the pipeline stack's `Scenario` parameter — `compose` (~$0.94
# measured) or `deploy` (unmeasured, $15 ceiling) — NOT by anything here. A job
# cannot pick the scenario; re-deploy the stack to change it.
#
# Cancelling either job does NOT stop the CodeBuild run, and that is the safe
# direction: the build's post_build tears down unconditionally, so letting it
# finish on its own is what prevents orphaned stacks.
#
# `allow_failure: true` is not indifference to the result — it is what keeps
# these MANUAL jobs non-blocking. Without it a first-stage manual job puts the
# whole pipeline in `blocked` and `pages` never deploys. A failed run therefore
# shows as a warning rather than a red pipeline; read the job.
#
# Nothing here runs automatically, on any branch, ever. Running from a feature
# branch is a supported use — the archive is that branch's checkout.
# ---------------------------------------------------------------------------
.integration-test-base:
  stage: test
  needs: []
  image: public.ecr.aws/docker/library/python:3.12-bookworm
  variables:
    # Set at JOB level, not as a project CI/CD variable. The internal
    # code.aws.dev runner vendors short-lived STS credentials into any job that
    # has this set — so at project level, `pages`, the ASH scans and the release
    # jobs would each be handed an AWS session they have no use for. No
    # id_tokens block and no assume-role step is needed; the runner does it.
    #
    # Account-specific by nature. .gitlab-ci.yml is excluded from the public
    # GitHub mirror, so the ARN lives here rather than in a variable that would
    # then apply everywhere. Deploy the role with
    # `make -C internal/infra/credential-vendor deploy CONFIRM=1` and paste its
    # GitLabRoleArn output.
    AWS_CREDS_TARGET_ROLE: arn:aws:iam::369530416671:role/InnovationPatternsGitLabCI
    AWS_DEFAULT_REGION: us-east-1
    # archive.py zips the WORKING TREE and shells out to `git ls-files`,
    # `git rev-parse HEAD` and `git status --porcelain` with check=True, so the
    # archive must carry a real .git. A shallow clone satisfies those three
    # calls, but the failure mode if it ever stops doing so is a bare
    # CalledProcessError inside a pytest fixture, so the depth is not left to a
    # default.
    GIT_DEPTH: "0"
  before_script:
    # AWS CLI v2 from the official installer, not Debian's `awscli` package,
    # which is v1. The Makefile targets were written and measured against v2.
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends make curl unzip
    - curl -fsS "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o /tmp/awscliv2.zip
    - unzip -q /tmp/awscliv2.zip -d /tmp
    - /tmp/aws/install
    - aws --version
    # Fails HERE, for free, if vending is broken. A wrong GitLab group or project
    # in the role's trust policy is denied with nothing naming the cause, so the
    # check is positioned before anything is uploaded or started.
    - aws sts get-caller-identity
  # Branch pipelines only, any branch, never on a tag pipeline. `$CI_COMMIT_BRANCH`
  # is unset on both tag and merge-request pipelines, so this one condition is
  # what keeps the job from being offered twice for a single push — the "may allow
  # multiple pipelines to run for a single action" warning a bare `when: manual`
  # earns. The trailing `when: never` makes the exclusion explicit rather than
  # relying on rules' default.
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: true
    - when: never

integration-test:start:
  extends: .integration-test-base
  script:
    - make -C internal/infra/codepipeline archive
    - make -C internal/infra/codepipeline upload
    - make -C internal/infra/codepipeline start CONFIRM=1
    - echo "Started. Poll it with the integration-test:watch job, or watch it here:"
    - echo "https://us-east-1.console.aws.amazon.com/codesuite/codepipeline/pipelines/ipa-integration-test-pipeline/view?region=us-east-1"

integration-test:watch:
  extends: .integration-test-base
  # Longer than this project's 1h default so a `deploy`-scenario run can be
  # followed to the end. An instance runner's own maximum_timeout still caps it,
  # and hitting either cap fails the job while the run continues — re-click this
  # job to pick the poll back up.
  timeout: 2h
  script:
    - make -C internal/infra/codepipeline watch

# GitLab Pages deployment job - must be named "pages" to trigger Pages deployment
# Builds Docusaurus documentation and publishes to https://<namespace>.gitlab.io/<project-name>/
pages:
  stage: deploy
  needs: []
  image: public.ecr.aws/docker/library/node:22-bookworm
  variables:
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "4Gi"
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: "4Gi"
    NODE_OPTIONS: "--max-old-space-size=3072"
  before_script:
    - corepack enable
    # Internal docs (developer-docs/internal/) DO publish to GitLab Pages —
    # this site is internal-only. They are filtered from the GitHub mirror
    # by internal/release/publish-github.sh EXCLUDE_PATHS, so they never reach
    # GitHub or GitHub Pages.
    - cd docs
    # Uses the pnpm version pinned in docs/package.json "packageManager"
    - pnpm install --frozen-lockfile
  script:
    - pnpm exec docusaurus build
    - mv build ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Stage 1 — internal release. Two manual jobs, whose NAMES are the documentation.
#
#   gitlab:release:preview   manual. Prints the version that would be cut and the
#                            exact notes that would be published. Creates NOTHING
#                            — no tag, no branch, no Release object.
#   gitlab:release           manual. Derives, asserts, tags origin, creates the
#                            GitLab Release. This is the release.
#
# So: click preview, read the notes, click release. The preview is a voluntary
# pre-flight, not a gate — nothing blocks a release on having run it.
#
# There is NO automatic tag-on-merge, no release branch, no release merge
# request, and no separate job for a major version. Releasing is a deliberate
# click. Both jobs call infra/scripts/release.sh, so the preview cannot report
# notes that differ from what a release publishes, and the script's
# absence-on-origin assertion means repeated clicks cannot double-tag.
#
# A MAJOR version bump is refused unless CONFIRM_VERSION equals the derived tag.
# The guard is keyed on the version's SHAPE rather than on commit text, so it
# holds after 1.0 as well — unlike cliff.toml's breaking_always_bump_major, which
# is inert once the major reaches 1.
#
# NOTHING PUSHES A BRANCH. That is why no `git remote set-url --push` appears
# below, and why the project setting Settings > CI/CD > Job token permissions >
# "Allow Git push requests to this project's repository" is NOT required.
#
# The version is DERIVED from tags and commit history — there is no VERSION file.
# `git-cliff --bumped-version` is the single source of truth.
#
# Publishing to the public GitHub mirror is stage 2 (`github:release`) and is
# deliberately NOT part of any job here. Cutting an internal release publishes
# nothing publicly. It also cannot be chained off a release: a CI-pushed tag
# triggers no pipeline, so such a chain would silently never fire.
#
# Why these are manual jobs on a BRANCH pipeline rather than tag-triggered: a
# tag pipeline cannot work here. `pages` requires $CI_COMMIT_BRANCH (unset on
# tag pipelines) and the release jobs require $CI_COMMIT_TAG == null. A manual
# job on a branch pipeline sidesteps both.
# ---------------------------------------------------------------------------
.release-base:
  stage: release
  image: public.ecr.aws/docker/library/python:3.12-bookworm
  variables:
    # Full clone required: version derivation walks history back to the newest
    # release tag, and tag operations need the tag objects themselves. A shallow
    # clone silently derives from the wrong base.
    GIT_DEPTH: "0"
  before_script:
    # Pinned to match the version every mechanism in this pipeline was verified
    # against. git-cliff is not in the base image.
    - pip install --quiet --disable-pip-version-check 'git-cliff==2.10.1'
    - git fetch origin --tags --force
    - git config user.email "ci@code.aws.dev"
    - git config user.name "GitLab CI"

# The pre-flight. Prints the version that would be cut and the exact notes that
# would be published, and creates nothing.
#
# Manual rather than automatic: with the changelog retired there is no merge
# request whose diff shows the notes, so this is the place to read them — and a
# job that ran on every push would be read on none of them.
#
# `allow_failure: true` keeps a failed preview from marking the pipeline failed.
# It creates nothing, so a failure here is informational. `needs: []` so it is
# reachable without waiting on the security scan, for the same reason.
gitlab:release:preview:
  extends: .release-base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: true
    - when: never
  needs: []
  script:
    - PREVIEW=1 bash infra/scripts/release.sh

# THE RELEASE. Derives, asserts, tags origin, creates the GitLab Release.
#
# `allow_failure: false`, unlike the preview: this one creates something
# irreversible, so a failure must be loud.
#
# `optional: true` on the ash dependency is required rather than cautious — ash
# is contributed by an included component, and a hard `needs` on a job that may
# not be in the graph makes the whole pipeline invalid instead of making the
# release wait.
#
# Clicking it when there is nothing to release exits SUCCESSFULLY having created
# nothing. That is deliberate: the button can be pressed speculatively, and a red
# pipeline for "nothing to do" is a red pipeline everyone learns to ignore.
gitlab:release:
  extends: .release-base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: false
    - when: never
  needs:
    - job: ash
      optional: true
  script:
    - bash infra/scripts/release.sh

# ---------------------------------------------------------------------------
# Stage 2 — public publish. ONE job:
#
#   github:release       manual. Its FIRST run, with no CONFIRM_TAG, is the DRY
#                        RUN: it prints TAG, FLOOR, the full notes body, and the
#                        filtered-path report, publishes nothing, and prints the
#                        exact CONFIRM_TAG value to re-run with. Re-running it
#                        with that value publishes — the one irreversible act in
#                        the release path, since it force-pushes a public
#                        repository that has accepted pull requests.
#
# So clicking this job never publishes by accident. The confirmation gate is
# unchanged; only the dry-run TRIGGER moved, from a separately named job to the
# absence of CONFIRM_TAG. A missing confirmation already expressed that intent,
# so the second job was a second way to say the same thing.
#
# Publishing is deliberately separate from cutting an internal release, so an
# internal release can be cut without going public and an OLDER tag can be
# published later (set TAG). The floor — what GitHub already has — is resolved
# from GitHub itself, so notes cover every change since the last publish even
# when several internal releases were skipped.
#
# Publishing withholds only TAGS and RELEASE OBJECTS, never code: the mirror
# amends the tip and force-pushes main, so a skipped release's code lands
# publicly anyway. That is what makes cumulative notes correctness rather than
# courtesy.
#
# It cannot be chained off gitlab:release: a CI-pushed tag triggers no pipeline,
# so such a chain would silently never fire.
# ---------------------------------------------------------------------------
.publish-base:
  stage: release
  image: public.ecr.aws/docker/library/python:3.12-bookworm
  variables:
    # Full clone required on two counts: the publish path unshallows before
    # reasoning about ancestry (a truncated graph answers "not an ancestor" for
    # commits that are), and git's pack negotiation otherwise references objects
    # past the shallow boundary, which GitHub rejects.
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: false
    - when: never
  before_script:
    - pip install --quiet --disable-pip-version-check 'git-cliff==2.10.1'
    # $GITHUB_DEPLOY_KEY is base64-encoded (masked + protected CI variable).
    # It lives on the publish jobs only — stage 1 never touches GitHub.
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - eval $(ssh-agent -s)
    - |
      # 350 bytes, not 200: the smallest key type we would ever use is an
      # OpenSSH ed25519 private key, which measures 387 bytes — so a 200-byte
      # floor accepts a key truncated to roughly half its length. The threshold
      # exists to catch a mis-pasted or clipped CI variable before ssh-add
      # fails with something less obvious, so it has to sit just under the
      # smallest legitimate key rather than far below it.
      DECODED_LEN=$(printf '%s' "$GITHUB_DEPLOY_KEY" | base64 -di 2>/dev/null | wc -c || true)
      if [ "${DECODED_LEN:-0}" -lt 350 ]; then
        echo "ERROR: GITHUB_DEPLOY_KEY decodes to only ${DECODED_LEN:-0} bytes." >&2
        echo "hint: expected >= 350 (an ed25519 private key is ~387 bytes, RSA-2048" >&2
        echo "      ~1800). A short value usually means the variable was truncated" >&2
        echo "      when pasted, or holds a PUBLIC key rather than the private one." >&2
        exit 1
      fi
    - printf '%s' "$GITHUB_DEPLOY_KEY" | base64 -di | ssh-add -
    - mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git fetch origin --tags --force

# The publish. NO CONFIRM_TAG means dry run — run it once to read the report and
# learn the value, then re-run with CONFIRM_TAG set to publish.
#
# Set TAG to publish something other than the newest internal tag; leave it unset
# for the newest. `--dry-run` is deliberately NOT passed: omitting CONFIRM_TAG is
# what makes this a dry run, and passing the flag as well would make the
# confirmation unreachable from CI.
github:release:
  extends: .publish-base
  needs: []
  script:
    - bash internal/release/publish-github.sh ${TAG:-}
