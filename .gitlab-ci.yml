# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

# ASH security scanning component
# Pinned to v3.0.5 — the internal `code.aws.dev` mirror has its own version
# line (v3.0.x) that does not track upstream awslabs/automated-security-helper.
# v3.0.5 (~2026-04-23) is the version against which our existing
# `cyclonedx: enabled: false` suppression in .ash/ash.yaml was added (2026-04-21)
# and verified working. v3.0.6 (~2026-05-16) appears to backport the upstream
# regression where the new `gitlab-cyclonedx` reporter emits a minimal "empty"
# SBOM that GitLab's parser rejects with "Required GitLab CycloneDX properties
# are missing" — our existing suppression does not cover that new reporter.
# Revisit when we wire up real GitLab dependency scanning, or when the mirror
# exposes a setting to disable the gitlab-cyclonedx reporter.
include:
  - component: code.aws.dev/proserve/automated-security-helper/automated-security-helper/ash@v3.0.5
  - component: code.aws.dev/proserve/genaiid/other/candidate-reusable-assets/code-quality/acq@develop

# Any publicly available python image
image: public.ecr.aws/docker/library/python:3.12-bookworm

stages:
  - test
#   - securityScan  # Inherited
  - deploy
  - release

# AWS credential vendor: the internal code.aws.dev GitLab runner detects the
# AWS_CREDS_TARGET_ROLE variable and vendors short-lived STS credentials for that
# role into the job environment automatically — no id_tokens / assume-role block
# needed. This job verifies the role assumption works before relying on it.
# test:
#   stage: test
#   variables:
#     AWS_CREDS_TARGET_ROLE: arn:aws:iam::369530416671:role/ip-dev-sdlc-GitLab
#     AWS_DEFAULT_REGION: us-east-1
#   script:
#     - aws sts get-caller-identity
#     - aws s3 ls

# GitLab Pages deployment job - must be named "pages" to trigger Pages deployment
# Builds Docusaurus documentation and publishes to https://<namespace>.gitlab.io/<project-name>/
pages:
  stage: deploy
  needs: []
  image: public.ecr.aws/docker/library/node:22-bookworm
  variables:
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    KUBERNETES_EPHEMERAL_STORAGE_REQUEST: "4Gi"
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: "4Gi"
    NODE_OPTIONS: "--max-old-space-size=3072"
  before_script:
    - corepack enable
    # Internal docs (developer-docs/internal/) DO publish to GitLab Pages —
    # this site is internal-only. They are filtered from the GitHub mirror
    # by infra/scripts/github-push.sh EXCLUDE_PATHS, so they never reach
    # GitHub or GitHub Pages.
    - cd docs
    # Uses the pnpm version pinned in docs/package.json "packageManager"
    - pnpm install --frozen-lockfile
  script:
    - pnpm exec docusaurus build
    - mv build ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Stage 1 — internal release. Jobs whose NAMES are the documentation.
#
# THE NORMAL FLOW is two steps, and only the first is a button:
#
#   release:prepare        manual. Regenerates CHANGELOG.md on a release/vX.Y.Z
#                          branch and opens a merge request. Creates NO tag —
#                          this is the review gate.
#   release:auto           AUTOMATIC on every push to main. Tags and creates the
#                          GitLab Release when a release MR was merged; does
#                          nothing on any other push. No button press.
#
# So: click prepare, review the notes, merge. The merge is the approval.
#
# SUPPORTING:
#
#   release:preview        automatic on every push, non-blocking, creates nothing.
#                          Shows what the next release would be.
#   release:prepare:major  manual, CONFIRM_VERSION-gated. The reviewed route to a
#                          major version — same flow, still no tag.
#
# BREAK-GLASS (not the normal path — recovery only, when release:auto fails for
# reasons unrelated to the release being correct):
#
#   release                manual. Tags and releases directly, no review.
#   release:major          manual, CONFIRM_VERSION-gated. Direct major, no review.
#
# All four release paths call infra/scripts/release-run.sh, so they cannot drift
# from one another, and its absence-on-origin assertion means no two of them can
# ever create the same tag.
#
# Publishing to the public GitHub mirror is stage 2 and is deliberately NOT part
# of any job here. It also cannot be chained off release:auto: a CI-pushed tag
# triggers no pipeline, so such a chain would silently never fire.
#
# The version is DERIVED from tags and commit history — there is no VERSION
# file. `git-cliff --bumped-version` is the single source of truth.
#
# Publishing to the public GitHub mirror is stage 2 (`publish:github:*`) and is
# deliberately NOT part of any job here. Cutting an internal release publishes
# nothing publicly.
#
# Why these are manual jobs on a BRANCH pipeline rather than tag-triggered: a
# tag pipeline cannot work here. `pages` requires $CI_COMMIT_BRANCH (unset on
# tag pipelines) and the release jobs require $CI_COMMIT_TAG == null. A manual
# job on a branch pipeline sidesteps both.
# ---------------------------------------------------------------------------
.release-base:
  stage: release
  image: public.ecr.aws/docker/library/python:3.12-bookworm
  variables:
    # Full clone required: version derivation walks history back to the newest
    # release tag, and tag operations need the tag objects themselves. A shallow
    # clone silently derives from the wrong base.
    GIT_DEPTH: "0"
  before_script:
    # Pinned to match the version every mechanism in this pipeline was verified
    # against. git-cliff is not in the base image.
    - pip install --quiet --disable-pip-version-check 'git-cliff==2.10.1'
    - git fetch origin --tags --force
    - git config user.email "ci@code.aws.dev"
    - git config user.name "GitLab CI"

# Automatic, non-blocking preview. Prints the version that would be cut and the
# exact notes that would be published, and creates nothing.
#
# `allow_failure: true` keeps it non-blocking; the derived-equals-latest branch
# below keeps it GREEN when there is simply nothing to release. Both are needed
# — a job that is usually red is a job everyone learns to ignore, at which point
# it also hides the one time it means something.
release:preview:
  extends: .release-base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      allow_failure: true
    - when: never
  needs: []
  script:
    - LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
    - DERIVED=$(git-cliff --bumped-version)
    # Quoted: a bare `: ` in a YAML plain scalar parses as a mapping key.
    - 'echo "current release: $LATEST"'
    - 'echo "would release:   $DERIVED"'
    - |
      if [ "$DERIVED" = "$LATEST" ]; then
        echo ""
        echo "Nothing to release — no commits since $LATEST affect the version."
        echo "Only conventional commits (feat:, fix:, ...) derive a new version."
        exit 0
      fi
    - echo ""
    - echo "--- release notes for $DERIVED ---"
    - git-cliff --unreleased --strip all
    - echo "--- end release notes ---"
    - echo ""
    - echo "To cut this release, run the 'release' job. Nothing has been created."

# Prepare a release for REVIEW. Regenerates CHANGELOG.md on a release/vX.Y.Z
# branch and opens a merge request. Creates NO tag and NO GitLab Release.
#
# This is the review gate. Before it existed, nobody saw the release notes in
# reviewable form before a tag existed — and a tag is the one artifact here that
# cannot be cleanly retracted. At v0.2.0 the committed CHANGELOG.md still read
# "## [Unreleased]" while the tag and the Release both said 0.2.0, because
# regenerating it was an optional step someone had to remember. Here the
# changelog IS the merge request.
#
# No `needs: [ash]`, unlike the release jobs below. `ash` gates the irreversible
# act of RELEASING; this job creates a reviewable MR and no tag, and the MR is
# itself gated by whatever runs on the release branch. Waiting on ash here would
# delay the review gate without protecting anything irreversible.
#
# A job-token push starts NO pipeline (GitLab documents this explicitly), so
# there is no loop risk and no [skip ci] guard is needed. It does require the
# project setting Settings > CI/CD > Job token permissions > "Allow Git push
# requests to this project's repository", and release/* must be UNPROTECTED.
release:prepare:
  extends: .release-base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: false
    - when: never
  needs: []
  script:
    # Push over HTTPS with the job token. The default clone remote is already
    # job-token-authenticated for FETCH; this makes it usable for PUSH.
    - git remote set-url --push origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - bash infra/scripts/release-prepare.sh

# Prepare a MAJOR release for review. The same flow as release:prepare — same
# script, same branch-and-MR shape — with the CONFIRM_VERSION gate. Separately
# named for the same reason release:major is: the job list is the runbook, and a
# major bump should not be reachable by clicking the ordinary button.
#
# Still creates no tag, so this is the SAFER of the two major paths: the
# irreversible act is deferred to a reviewed merge.
release:prepare:major:
  extends: .release-base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: false
    - when: never
  needs: []
  script:
    - git remote set-url --push origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - bash infra/scripts/release-prepare.sh major

# THE NORMAL RELEASE PATH. Automatic, on every push to main, and its usual
# outcome is to do nothing.
#
# Merging a release MR is the approval, so tagging afterwards is bookkeeping —
# and bookkeeping is what CI is for. Before this job, a releaser had to notice
# the merge landed, find the pipeline, and click a button, which is the same
# remember-to-do-it gap that produced the stale changelog at v0.2.0.
#
# TWO conditions must BOTH hold, and neither alone is sufficient:
#
#   1. the derived version differs from the newest tag, and
#   2. a `chore(release): ` commit is reachable since that tag.
#
# Condition 1 alone would tag on every ordinary feature merge. Condition 2 alone
# would re-tag an already-released marker. This pairing is also why auto-tagging
# works now when it was reverted in 2026-05: that attempt gated on
# `changes: [VERSION]`, so there was no way to merge to main for non-release
# purposes without either faking a release or losing one. Derivation supplies the
# semantic trigger a file-modification check could not.
#
# Why the marker rather than merge-request variables: every CI_MERGE_REQUEST_*
# variable requires an OPEN merge request and a merge-request pipeline. After a
# merge both conditions fail, so this pipeline cannot see the MR it came from.
# Merge-commit subject tests and parent-count tests were both tried and both fail
# under a squash merge — verified. The marker survives both methods because
# release-prepare.sh makes the MR TITLE the marker (GitLab defaults a squash
# commit's subject to the title).
#
# NOT gated on $CI_PIPELINE_SOURCE. Its value on a merge-triggered pipeline has
# never been observed in this project, and gating on an unobserved value is how
# you get a job that silently never runs — this repository already has one
# recorded instance of exactly that (a rule on $CI_PIPELINE_SOURCE != "push" that
# was dead code and never fired).
release:auto:
  extends: .release-base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
    - when: never
  needs:
    - job: ash
      optional: true
  script:
    - TAG=$(git-cliff --bumped-version)
    - LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
    - |
      if [ "$TAG" = "$LATEST" ]; then
        echo "No release: derived version equals the current tag ($LATEST)."
        echo "Nothing in this push affects the version. This is the normal outcome"
        echo "for an ordinary push — nothing was created."
        exit 0
      fi
    - |
      # The release marker, scoped to the range since the newest tag. Scoping is
      # what makes "reachable AND untagged" precise: a marker older than $LATEST
      # was already released and is invisible here.
      if [ "$LATEST" = "none" ]; then
        RANGE="HEAD"
      else
        RANGE="$LATEST..HEAD"
      fi
      if ! git log "$RANGE" --format='%s' | grep -q '^chore(release): '; then
        echo "No release: $TAG is derivable, but no release marker was found in $RANGE."
        echo ""
        echo "This is the normal outcome for an ordinary feature merge. A release"
        echo "happens only when a prepared release MR is merged, which carries a"
        echo "'chore(release): ' commit subject."
        echo "hint: to release $TAG, run the 'release:prepare' job and merge the"
        echo "      merge request it opens."
        exit 0
      fi
    - echo "Release marker found for $TAG — releasing."
    # ADVISORY_CHANGELOG: a changelog mismatch WARNS rather than fails here.
    # A mismatch in this path usually means somebody else merged something while
    # the release was under review — ordinary team activity, not a release defect,
    # and not something the releaser can control. The notes attached to the tag
    # are generated fresh from history, so the PUBLISHED notes are complete
    # regardless; only the committed file lags, and it is regenerated in full at
    # the next release. See infra/scripts/release-check.sh for the full reasoning.
    - ADVISORY_CHANGELOG=1 bash infra/scripts/release-run.sh

# BREAK-GLASS. Manual, and not the normal path — release:auto above is.
#
# Kept deliberately: the automatic path can fail for reasons that have nothing to
# do with the release being correct (a runner outage, a transient API failure, ash
# unavailable), and a release process with no manual override is one that blocks
# on its own infrastructure.
#
# It CANNOT double-tag. It calls the same release-run.sh, whose absence-on-origin
# assertion covers both orderings — automatic-then-manual and manual-then-automatic.
#
# Unlike release:auto it does NOT set ADVISORY_CHANGELOG, so the changelog
# assertion stays a hard gate here: an operator running this regenerated the
# changelog moments ago, so a mismatch means they got it wrong.
release:
  extends: .release-base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: false
    - when: never
  needs:
    - job: ash
      optional: true
  script:
    - bash infra/scripts/release-run.sh

# Major release. Separately named and confirmation-gated because it is one of
# only two irreversible acts in the release path (the other is publishing).
#
# NOTE: breaking_always_bump_major = false is INERT once the major reaches 1.
# After 1.0.0 the ordinary `release` job will coin majors from feat!: commits
# and this job becomes decorative — accepted, since a feat!: commit genuinely
# should mean a major at that point. This job exists for the 0.x -> 1.0
# transition, which is the transition it will actually be used for.
release:major:
  extends: .release-base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: false
    - when: never
  needs:
    - job: ash
      optional: true
  script:
    - TAG=$(git-cliff --bump major --bumped-version)
    # Gate BEFORE anything is created. A gate that fires after tagging is not a gate.
    - |
      if [ "${CONFIRM_VERSION:-}" != "$TAG" ]; then
        echo "error: major release requires explicit confirmation" >&2
        echo "would cut: $TAG" >&2
        echo "hint: re-run this job with CONFIRM_VERSION=$TAG" >&2
        echo "hint: the REVIEWED route to a major is 'release:prepare:major', which" >&2
        echo "      opens an MR and creates no tag. Prefer it over this job." >&2
        exit 1
      fi
    - echo "Releasing MAJOR $TAG (confirmed)"
    - bash infra/scripts/release-run.sh major

# ---------------------------------------------------------------------------
# Stage 2 — public publish. Two jobs:
#
#   publish:github:plan  manual dry run. Prints TAG, FLOOR, the full notes body,
#                        the filtered-path report, and the exact CONFIRM_TAG
#                        value. Publishes nothing.
#   publish:github       manual, CONFIRM_TAG-gated. The one irreversible act in
#                        the release path — it force-pushes a public repository
#                        that has accepted pull requests.
#
# Publishing is deliberately separate from cutting an internal release, so an
# internal release can be cut without going public and an OLDER tag can be
# published later. The floor (what GitHub already has) is resolved from GitHub
# itself, so notes cover every change since the last publish even when several
# internal releases were skipped.
#
# The plan job exists as a NAMED job rather than a DRY_RUN flag so that someone
# publishing for the first time finds it without needing to know a variable name.
# ---------------------------------------------------------------------------
.publish-base:
  stage: release
  image: public.ecr.aws/docker/library/python:3.12-bookworm
  variables:
    # Full clone required on two counts: the publish path unshallows before
    # reasoning about ancestry (a truncated graph answers "not an ancestor" for
    # commits that are), and git's pack negotiation otherwise references objects
    # past the shallow boundary, which GitHub rejects.
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
      when: manual
      allow_failure: false
    - when: never
  before_script:
    - pip install --quiet --disable-pip-version-check 'git-cliff==2.10.1'
    # $GITHUB_DEPLOY_KEY is base64-encoded (masked + protected CI variable).
    # It lives on the publish jobs only — stage 1 never touches GitHub.
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - eval $(ssh-agent -s)
    - |
      # 350 bytes, not 200: the smallest key type we would ever use is an
      # OpenSSH ed25519 private key, which measures 387 bytes — so a 200-byte
      # floor accepts a key truncated to roughly half its length. The threshold
      # exists to catch a mis-pasted or clipped CI variable before ssh-add
      # fails with something less obvious, so it has to sit just under the
      # smallest legitimate key rather than far below it.
      DECODED_LEN=$(printf '%s' "$GITHUB_DEPLOY_KEY" | base64 -di 2>/dev/null | wc -c || true)
      if [ "${DECODED_LEN:-0}" -lt 350 ]; then
        echo "ERROR: GITHUB_DEPLOY_KEY decodes to only ${DECODED_LEN:-0} bytes." >&2
        echo "hint: expected >= 350 (an ed25519 private key is ~387 bytes, RSA-2048" >&2
        echo "      ~1800). A short value usually means the variable was truncated" >&2
        echo "      when pasted, or holds a PUBLIC key rather than the private one." >&2
        exit 1
      fi
    - printf '%s' "$GITHUB_DEPLOY_KEY" | base64 -di | ssh-add -
    - mkdir -p ~/.ssh && ssh-keyscan github.com >> ~/.ssh/known_hosts
    - git fetch origin --tags --force

# Dry run. Set TAG to publish something other than the newest internal tag.
publish:github:plan:
  extends: .publish-base
  needs: []
  script:
    - bash internal/release/publish-github.sh --dry-run ${TAG:-}

# The irreversible act. Requires CONFIRM_TAG to equal the tag being published;
# run publish:github:plan first to learn the value.
publish:github:
  extends: .publish-base
  needs: []
  script:
    - bash internal/release/publish-github.sh ${TAG:-}
