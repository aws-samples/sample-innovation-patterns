[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}** — {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }}
{% endfor %}
{% endfor -%}
"""

# No footer. Per-version compare links are deliberately not generated:
#
#   1. Under selective publication, gaps in the public tag sequence are routine,
#      so a link between two versions where only one was published is a 404 by
#      construction. This repository already published one (v0.1.5).
#   2. Hardcoding a forge URL here makes any copy of this config emit links to
#      the original project's repository.
#
# Tags and forge Release objects are the durable, navigable record.

trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
sort_commits = "oldest"
# Strict semver only. A permissive pattern lets a stray prerelease-shaped tag
# (v0.9.9-rc1) become the derivation base — verified.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
protect_breaking_commits = false
commit_parsers = [
    # OPTIONAL — delete this line in a new project.
    #
    # It exists because the repository this template came from had a run of
    # auto-generated "Update: modify N file(s)" commits that would otherwise fill
    # the changelog with diffstat noise. A fresh project has no such history.
    #
    # Kept here as the pattern to copy when you inherit a repository whose
    # history predates the convention: one skip parser neutralizes the changelog
    # symptom without rewriting history.
    { message = "^Update:", skip = true },
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^ci", group = "CI/Build" },
    { message = "^build", group = "CI/Build" },
    { message = "^revert", group = "Reverted" },
    { message = "^style", skip = true },
    { message = "^test", skip = true },
    { message = "^chore", skip = true },
]

[bump]
# Pre-1.0 guard: a `feat!:` commit yields 0.x+1 rather than 1.0.0. Reaching 1.0.0
# is a deliberate act via the release:major job, not something ordinary derivation
# can stumble into.
#
# INERT once the major is >= 1 — verified: at v1.0.0 a `feat!:` still derives
# v2.0.0. This is pre-1.0 scaffolding, not a permanent invariant.
breaking_always_bump_major = false
