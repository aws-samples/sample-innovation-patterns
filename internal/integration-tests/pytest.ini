[pytest]
testpaths = .

# Registered explicitly. app-lib/pytest.ini uses --strict-markers, where an
# unregistered marker is a HARD ERROR; elsewhere it is a PytestUnknownMarkWarning
# that is easy to miss.
markers =
    integration: drives a real agent against real AWS. COSTS MONEY.
    teardown: deletes real AWS resources. Requires IPA_IT_TEARDOWN=1 as well.

# --strict-markers here too, so a typo'd marker fails rather than silently
# selecting nothing -- a `-m integraton` run that selects zero tests exits 0.
addopts = --strict-markers
