[project]
name = "integration-tests"
version = "0.1.0"
description = "Maintainer-only integration harness that drives the real IPA lifecycle against a live AWS sandbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pytest>=8.3",
    # Declared explicitly even before anything calls it. The reference harness's
    # F3 was a missing `requests` in its own environment, masked by another bug
    # that fired first -- a bug can be load-bearing for a green-looking suite.
    "requests>=2.32",
]

[project.optional-dependencies]
# Behind an extra so a machine without the SDK still COLLECTS the offline tests.
# preflight.py's claude_agent_sdk probe reporting a negative outcome is the
# expected reading on such a machine.
agent = [
    "claude-agent-sdk>=0.1",
]
