[pytest]
testpaths = .

# Registered with wording specific to THIS scenario, not the generic "costs money".
# What it costs and what it creates differ per scenario, and the marker description is
# where a reader looks before running one.
#
# The `teardown` marker is deliberately NOT registered here: this scenario has no
# teardown assertions, and with --strict-markers an unused registration would let
# `-m teardown` silently select nothing rather than erroring.
markers =
    integration: drives the agent to /ipa-compose only. Model spend, plus one real
        {ns}-{env}-security stack (two named IAM roles — free but real). No billable
        infrastructure.

# -p loads the shared fixtures as a PLUGIN, so neither scenario copies them and neither
# imports from the other's conftest. It has to be a plugin rather than an import because
# harness.fixtures also supplies the pytest_runtest_makereport hook, and pytest collects
# hooks only from conftest files and plugins.
#
# --import-mode=importlib is what keeps the layout extensible, and it is load-bearing
# rather than stylistic: under pytest's default `prepend` mode, two scenarios each
# holding a test_smoke.py collide on module name and one SILENTLY shadows the other —
# collection succeeds and one module's assertions never run.
addopts = --strict-markers --import-mode=importlib -p harness.fixtures
