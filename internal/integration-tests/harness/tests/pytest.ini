[pytest]
testpaths = .

# NO markers are registered, and none are used. This directory is the free regression
# suite for the shared harness modules: no credentials, no AWS call, nothing created.
# The DIRECTORY is what separates free from billable now, which is why these modules
# no longer need a marker or a name prefix to say so.

# --strict-markers so a marker typo'd into a module here is a hard error rather than a
# warning -- an unregistered marker elsewhere is a PytestUnknownMarkWarning that is
# easy to miss.
#
# --import-mode=importlib because this tree holds more than one test directory. Under
# pytest's default `prepend` mode, two directories each holding a same-named module
# collide and one silently shadows the other, with no error at collection.
addopts = --strict-markers --import-mode=importlib
