[pytest]
testpaths = .

# Both markers are registered here because this scenario has assertions for both. Their
# wording is specific to THIS scenario — what it costs and what it leaves behind differ
# per scenario, and the marker description is where a reader looks before running one.
markers =
    integration: drives the FULL LIFECYCLE — /ipa-init, /ipa-compose, /ipa-prepare,
        /ipa-deploy. Creates SEVEN billable stacks and LEAVES THEM STANDING.
    teardown: deletes real AWS resources. Requires IPA_IT_TEARDOWN=1 as well as this
        marker — one opt-in is satisfiable by accident.

# -p loads the shared fixtures as a PLUGIN, so neither scenario copies them and neither
# imports from the other's conftest. It has to be a plugin rather than an import because
# harness.fixtures also supplies the pytest_runtest_makereport hook, and pytest collects
# hooks only from conftest files and plugins.
#
# --import-mode=importlib is load-bearing rather than stylistic: under pytest's default
# `prepend` mode, two scenarios each holding a same-named test module collide and one
# SILENTLY shadows the other — collection succeeds and one module's assertions never run.
addopts = --strict-markers --import-mode=importlib -p harness.fixtures
