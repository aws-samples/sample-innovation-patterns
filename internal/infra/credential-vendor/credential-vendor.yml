AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  IAM role assumed by this repository's GitLab CI jobs via the code.aws.dev
  credential vendor, scoped to STARTING a run of the integration-test pipeline
  and reading its result. Deployed once, by hand, per target AWS account.
  Internal maintainer artifact — not shipped to customers. See README.md.

# ─────────────────────────────────────────────────────────────────────────────
# HOW THE CREDENTIALS ARRIVE (two hops, two accounts)
#
#   hop 1  the vendor reads the job's CI_JOB_TOKEN and assumes a role in jump
#          account 979517299116, which attaches the job's GitLab metadata as
#          PRINCIPAL TAGS — derived from the real running job, not supplied by
#          the caller.
#   hop 2  it presents arn:aws:iam::352364310414:role/prod_jump_role to THIS
#          role, with a RoleSessionName of <alias>-GitLab for CloudTrail.
#
# Only the hop-2 role is a trust-policy principal. Naming the hop-1 account here
# instead produces a role that deploys cleanly, reports success, and fails only
# when a CI job first tries to assume it.
#
# WHY THIS ROLE IS NOT AN ADMINISTRATOR
#
# The reference implementation this is modelled on
# (launchbridge/internal/infra/credential-vendor) attaches AdministratorAccess,
# because there CI deploys stacks directly. Here it must not: the privilege that
# runs the integration test belongs to the pipeline's OWN CodeBuild role, in
# integration-test-pipeline.yml. All this role needs is "put one object, start
# one pipeline, read its status" — a small, enumerable set that does not chase a
# moving target, and does not put a second administrator in the account.
#
# Read that as the design: a stolen CI token buys the ability to start a test
# run, not the ability to do anything in the account directly. It is still
# INDIRECT administrator access, because the code it uploads runs under the
# CodeBuild role — see the posture section of README.md, which does not pretend
# otherwise. Narrowing this role removes one path, not the path.
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  RoleName:
    Type: String
    Default: 'InnovationPatternsGitLabCI'
    Description: >-
      Name of the created role. Explicit because its ARN goes into a GitLab
      CI/CD variable, so the name must stay stable across stack updates.

  GitLabGroupName:
    Type: String
    Description: >-
      Full group path of the repository, INCLUDING every subgroup — e.g.
      proserve/genaiid/other/candidate-reusable-assets. A partial path fails
      CLOSED: assumption is denied with nothing indicating the path was wrong.

  GitLabProjectName:
    Type: String
    Default: 'innovation-patterns'
    Description: >-
      Project name of the repository. Not sufficient on its own — project names
      are not unique across groups, which is why the group is also matched.

  PipelineName:
    Type: String
    Default: 'ipa-integration-test-pipeline'
    Description: >-
      Pipeline this role may start. Read from the pipeline stack's PipelineName
      output (`make -C ../codepipeline outputs`). Taken as a parameter rather
      than imported, so this stack stays deployable independently of that one.

  SourceBucketName:
    Type: String
    Description: >-
      Bucket this role may upload the source archive to. Read from the pipeline
      stack's SourceBucketName output — it is CloudFormation-generated, so it
      cannot be derived from a name and must be passed.

  SourceObjectKey:
    Type: String
    Default: 'source/source.zip'
    Description: >-
      The ONE key this role may write. Scoping to the key rather than the bucket
      is what stops a compromised job from filling the bucket, and it must match
      the pipeline's SourceObjectKey — the source action watches only that key.

Resources:
  GitLabRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: >-
        Starts integration-test pipeline runs from GitLab CI. Holds no
        deploy permissions of its own.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        # ONE statement, carrying the principal, both actions, and both
        # conditions together.
        #
        # Splitting sts:AssumeRole and sts:TagSession into two statements that
        # each repeat the condition block is safe only while the repetition
        # stays correct. Any statement here that permits assumption WITHOUT the
        # conditions fails OPEN — it independently allows assumption, so the
        # conditions stop constraining anything and the role becomes assumable
        # by any project on the instance, with nothing appearing broken.
        # Nothing in this repository detects that. Keep it to one statement.
        Statement:
          - Effect: Allow
            Principal:
              # Hop-2 role of code.aws.dev's credential vendor. Platform
              # documentation: do not change this.
              AWS: 'arn:aws:iam::352364310414:role/prod_jump_role'
            Action:
              - 'sts:AssumeRole'
              # Mandatory. The vendor tags the session with job metadata during
              # hop 2; without this the assumption is denied outright.
              - 'sts:TagSession'
            Condition:
              # PrincipalTag, not RequestTag — this reads as a bug and is not.
              # Hop 1 already attached this metadata as principal tags on the
              # caller, derived from the real running job, so by hop 2 it cannot
              # be forged. Gating on RequestTag would test values the caller
              # supplies with its own request, i.e. nothing, and would break
              # vending outright.
              StringEquals:
                'aws:PrincipalTag/GitLab:Group': !Ref GitLabGroupName
                'aws:PrincipalTag/GitLab:Project': !Ref GitLabProjectName
      Policies:
        - PolicyName: 'trigger-integration-test'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # PutObject on ONE key, and GetBucketVersioning because the
              # uploading client reads it to confirm the bucket is versioned
              # before relying on the source action.
              - Sid: 'UploadSourceArchive'
                Effect: Allow
                Action:
                  - 's3:PutObject'
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SourceBucketName}/${SourceObjectKey}'
              - Sid: 'ReadBucketVersioning'
                Effect: Allow
                Action:
                  - 's3:GetBucketVersioning'
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SourceBucketName}'
              # Start a run and read its progress. GetPipelineState and
              # GetPipelineExecution are what a CI job polls to decide whether
              # the run passed; without them a job can start a run and never
              # learn its result, which reports success for a failed test.
              - Sid: 'StartAndWatchThePipeline'
                Effect: Allow
                Action:
                  - 'codepipeline:StartPipelineExecution'
                  - 'codepipeline:GetPipelineState'
                  - 'codepipeline:GetPipelineExecution'
                  - 'codepipeline:ListActionExecutions'
                Resource: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${PipelineName}'
              # Read the build's logs and reports. Deliberately read-only and
              # deliberately NOT codebuild:StartBuild — a run must enter through
              # the pipeline, so that the source archive under test is the one
              # recorded in the pipeline execution.
              - Sid: 'ReadBuildResults'
                Effect: Allow
                Action:
                  - 'codebuild:BatchGetBuilds'
                  - 'codebuild:BatchGetReports'
                  - 'codebuild:DescribeTestCases'
                Resource: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${PipelineName}-*'
              # The build's own log group. Scoped by the pipeline stack's naming
              # convention rather than granted account-wide.
              - Sid: 'ReadBuildLogs'
                Effect: Allow
                Action:
                  - 'logs:GetLogEvents'
                  - 'logs:FilterLogEvents'
                  - 'logs:DescribeLogStreams'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${PipelineName}-*:*'

Outputs:
  GitLabRoleArn:
    Description: 'ARN of the role. This is the value for the AWS_CREDS_TARGET_ROLE CI/CD variable.'
    Value: !GetAtt GitLabRole.Arn

  GitLabRoleName:
    Description: 'Name of the created role.'
    Value: !Ref GitLabRole
