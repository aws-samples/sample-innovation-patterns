{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app-lib.serviceAccountName" . }}
  labels:
    {{- include "app-lib.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  # IRSA: set eks.amazonaws.com/role-arn here to bind a scoped IAM role to the
  # pod (the cloud, least-privilege alternative to the local host-mount).
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
