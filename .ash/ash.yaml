# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
project_name: innovation-patterns

reporters:
  # ASH emits an empty `{}` CycloneDX document when no SBOM data is collected,
  # which GitLab's SBOM parser rejects with "Required GitLab CycloneDX
  # properties are missing". Disable until ASH emits a schema-valid SBOM or
  # a proper dependency-scanning integration is used instead.
  cyclonedx:
    enabled: false

global_settings:
  ignore_paths:
    # pytest.ini is not infrastructure-as-code — KICS misparses it as a config file
    - path: 'app-lib/pytest.ini'
      reason: 'Not IaC — pytest configuration file; KICS cannot parse INI format and emits false errors'
    # node_modules/ at the repo root is not this project's dependency tree. There is no
    # root package.json and no root lockfile, and nothing at root is tracked by git — the
    # tree is installed into the checkout during the pipeline by another component's own
    # toolchain (its contents are @typescript-eslint, @ts-morph/common, hono,
    # @hono/node-server, undici, react-router, postcss). npm-audit resolves that tree and
    # reported 49 findings on 2026-08-17.
    #
    # CORRECTION (2026-08-17): an earlier version of this comment justified the ignore by
    # claiming every one of those findings is "pure duplication" of what grype reports
    # against the real lockfiles. That is not true, and the claim should not be relied on
    # to widen this ignore. grype reports NOTHING against web-client/package-lock.json for
    # hono, @hono/node-server, undici, ip-address, brace-expansion, fast-uri, js-yaml or
    # body-parser, while `npm audit` reports eight advisory groups (five High) across them,
    # all inside the shadcn dev-CLI subtree. The ignore is still correct on its own terms —
    # an untracked tree installed by a different component is not this project's to scan —
    # but that subtree is currently covered by NO scanner in CI. Tracked separately.
    #
    # These patterns are globs, and a bare directory prefix ('node_modules/') does not
    # match the files beneath it — which is why the previous entry had no effect while the
    # exact-path entries above and below it work. Both forms are listed because the root
    # tree and any nested tree must both be excluded.
    - path: 'node_modules/**'
      reason: 'Not this project''s dependency tree — installed into the checkout root by another pipeline component; no root package.json or lockfile exists and nothing at root is tracked by git. Real deps are scanned via docs/pnpm-lock.yaml and web-client/package-lock.json, which grype covers.'
    - path: '**/node_modules/**'
      reason: 'Installed dependency trees are build output, not first-party source. Vulnerabilities in real dependencies are reported against the lockfiles (docs/pnpm-lock.yaml, web-client/package-lock.json, app-lib/uv.lock); scanning the unpacked tree only duplicates them.'
    # app-lib/build/ is a git-ignored Lambda build artifact (vendored third-party
    # packages copied into deployment_package/). It is not source, not tracked by
    # git, and never present in a clean CI checkout — a local `brazil-build`/package
    # step populates it. Scanning it floods results with findings in vendored deps'
    # own test files (docstring_parser, referencing, cffi, jinja2, ...). Same
    # rationale as node_modules/: artifact directory, not first-party source.
    # Written as a glob for the same reason as node_modules/** above: a bare directory
    # prefix does not match the files beneath it.
    - path: 'app-lib/build/**'
      reason: 'Git-ignored Lambda build artifact (vendored third-party packages in deployment_package/); not first-party source and absent from clean CI checkouts. Real dependencies are scanned via app-lib/uv.lock. Mirrors the node_modules/** ignore rationale.'
  suppressions:
    # Bandit B101: assert is the standard pytest assertion mechanism, not a production guard clause
    - rule_id: 'B101'
      path: 'app-lib/tests/*'
      reason: 'assert statements are expected in pytest test files'
    # (Removed 2026-08-17: the B101 utils/tests/*, B603 utils/*, B404 utils/* and
    # GHSA-5239-wwwm-4pmq-pygments utils/uv.lock entries. There is no utils/ directory
    # in this repository, so none of those paths could match a finding.)
    #
    # internal/integration-tests: maintainer-only harness that drives the real IPA
    # lifecycle against a live AWS sandbox. Not shipped — internal/ is excluded from
    # the public GitHub mirror (internal/release/publish-github.sh). Measured with
    # bandit against the first-party modules: B101 only, and zero findings at MEDIUM
    # or above. B404/B603/B607 are additionally suppressed by path because ASH runs
    # its own bandit configuration, which need not honour the inline `# nosec`
    # markers the source already carries.
    #
    # Written as `/**` rather than `/*` for the reason the node_modules ignore above
    # records: a bare prefix does not match files beneath it, and `/*` would stop
    # matching the day the harness grows a subdirectory.
    - rule_id: 'B101'
      path: 'internal/integration-tests/**'
      reason: 'assert statements are expected in pytest test files, and workspace.py asserts its preconditions deliberately so a caller that skips the tests cannot build a subtly wrong temp project'
    - rule_id: 'B404'
      path: 'internal/integration-tests/**'
      reason: 'subprocess import is required to invoke git, docker, npm, uv, make and the AWS CLI — the harness exercises the generated Makefiles as a customer would, so it must shell out to the same tools'
    - rule_id: 'B603'
      path: 'internal/integration-tests/**'
      reason: 'every subprocess call passes an argv list with shell=False, so no shell quoting applies and paths containing spaces pass through intact; the argv lists are constant literals with no interpolated user input'
    - rule_id: 'B607'
      path: 'internal/integration-tests/**'
      reason: 'git, docker, npm, uv, make and aws are resolved via PATH rather than absolute paths — hard-coding a Homebrew prefix would break the harness on any machine but one, and exploiting a partial path requires write access to the maintainer PATH, a broader compromise than this harness'
    # GenerateSecret is a standard CloudFormation property name, not an actual secret value
    - rule_id: 'SECRET-SECRET-KEYWORD'
      path: 'infra/cfn/cognito/cognito.yml'
      reason: 'False positive — GenerateSecret: false is a CloudFormation property on AWS::Cognito::UserPoolClient, not a secret value'
    # AdvancedSecurityMode is already ENFORCED — scanner false positive
    - rule_id: 'AwsSolutions-COG3'
      path: 'infra/cfn/cognito/cognito.yml'
      reason: 'False positive — AdvancedSecurityMode is already set to ENFORCED on the CognitoUserPool resource'
    # Jinja2 direct use — renders YAML/text templates, not HTML served to a browser; no XSS vector
    - rule_id: 'python.flask.security.xss.audit.direct-use-of-jinja2.direct-use-of-jinja2'
      path: 'app-lib/src/app_lib/common/util/jinja_util.py'
      reason: 'JinjaUtil renders YAML/text templates for code generation, not HTML served in a browser — no XSS vector'
    # Same finding from GitLab Advanced SAST (different rule ID, same root cause)
    - rule_id: 'python-jinja2-xss-autoescape-false-atomic'
      path: 'app-lib/src/app_lib/common/util/jinja_util.py'
      reason: 'JinjaUtil renders YAML/text templates for code generation, not HTML served in a browser — no XSS vector'
    # CRLF injection — false positive; header value is str(len(response_body)), always a non-negative integer.
    # No user input flows into the header; an integer string cannot contain CRLF characters.
    - rule_id: 'python-httpserver-crlfi-taint'
      path: 'app-lib/src/app_lib/common/lambda/lambda_handler.py'
      reason: 'False positive — Content-Length header value is str(len(bytes)), always a non-negative integer; no user input in header values'
    # (Removed 2026-08-17: AwsSolutions-DDB3 on utils/tests/fixtures/* — no utils/ directory exists.)
    # OpenAPI schema is auto-generated by FastAPI and lacks securitySchemes declarations,
    # but the API is protected at runtime by JWTAuthMiddleware (app_lib/rest/auth.py)
    # which validates Cognito Bearer tokens on all non-public paths
    - rule_id: 'CKV_OPENAPI_4'
      path: 'web-client/openapi-schema.json'
      reason: 'Auto-generated OpenAPI spec does not declare security schemes, but all API endpoints are protected by JWTAuthMiddleware with Cognito JWT validation'
    # ECR KMS encryption — out of scope for POC; uses default AES-256 encryption.
    # Customers can add a KMS key via the EncryptionConfiguration property when productionizing.
    - rule_id: 'CKV_AWS_136'
      path: 'infra/cfn/ecr/ecr.yml'
      reason: 'Out of scope for POC — ECR uses default AES-256 encryption; customers can add KMS EncryptionConfiguration when productionizing'
    - rule_id: 'CKV_AWS_136'
      path: 'infra/tf/ecr/main.tf'
      reason: 'Out of scope for POC — ECR uses default AES-256 encryption; customers can add an encryption_configuration block with encryption_type = "KMS" when productionizing. Mirrors CFN suppression on infra/cfn/ecr/ecr.yml.'
    # S3 server access logging on the Terraform state bucket — intentionally omitted.
    # This stack bootstraps a TF state backend for a POC. In any real environment the
    # state infrastructure already exists (a platform/landing-zone team owns the state
    # bucket and its logging destination), so this stack would not be deployed there.
    # Enabling logging here would couple this first-to-deploy bootstrap stack to the
    # later logs stack via ImportValue. The state store already has versioning (tracks
    # every change), SSE, TLS-only, and full public-access block; CloudTrail data events
    # are the standard audit mechanism. Documented at infra/cfn/tfstate/tfstate.yml.
    - rule_id: 'CKV_AWS_18'
      path: 'infra/cfn/tfstate/tfstate.yml'
      reason: 'Out of scope for POC — bootstrap TF state backend; real environments already own state infra + its logging destination. Enabling logging here couples this first-to-deploy stack to the logs stack via ImportValue. Versioning/SSE/TLS-only/public-access-block already present; CloudTrail data events are the audit mechanism.'
    # ECR immutable tags — out of scope for POC; mutable tags allow iterative development.
    # Customers should switch to IMMUTABLE when productionizing.
    - rule_id: 'CKV_AWS_51'
      path: 'infra/cfn/ecr/ecr.yml'
      reason: 'Out of scope for POC — mutable tags simplify iterative development; switch to IMMUTABLE when productionizing'
    - rule_id: 'CKV_AWS_51'
      path: 'infra/tf/ecr/main.tf'
      reason: 'Out of scope for POC — mutable tags simplify iterative development; customers can set image_tag_mutability = "IMMUTABLE" when productionizing. Mirrors CFN suppression on infra/cfn/ecr/ecr.yml.'
    # OpenAPI array maxItems — auto-generated by FastAPI; API already enforces practical
    # limits via query params (limit capped at 2000/500). Adding maxItems requires
    # customizing Pydantic models or OpenAPI generation — out of scope for POC.
    - rule_id: 'CKV_OPENAPI_21'
      path: 'web-client/openapi-schema.json'
      reason: 'Out of scope for POC — auto-generated FastAPI schema; API enforces practical limits via capped query params'
    # Same root cause as CKV_OPENAPI_4 — auto-generated FastAPI schema has no security
    # operations declared, but runtime auth is enforced by JWTAuthMiddleware
    - rule_id: 'CKV_OPENAPI_5'
      path: 'web-client/openapi-schema.json'
      reason: 'Auto-generated OpenAPI spec has no security operations, but all API endpoints are protected by JWTAuthMiddleware with Cognito JWT validation'
    # image-size 2.0.2 — infinite-loop DoS in the JXL/HEIF parsers (GHSA-5p2g-fcmc-qvqq,
    # CVE-2025-71329) and in the ICNS parser (GHSA-w3rx-r6r6-pgpr, CVE-2025-71330).
    #
    # NO FIX EXISTS. Both advisories record `last_affected: 2.0.2` with no fixed event,
    # and 2.0.2 is `latest` on npm — the `legacy: 1.2.1` tag falls inside the affected
    # range too, so downgrading does not help either. An override cannot resolve this.
    #
    # Not reachable by an attacker here. image-size is a build-time dependency of
    # @docusaurus/mdx-loader, which measures images that are already committed to this
    # repository; the docs build takes no untrusted input, and image-size appears in no
    # runtime bundle. Triggering either parser loop requires commit access to this repo,
    # at which point a crafted JXL/HEIF/ICNS file is not the interesting attack.
    #
    # Revisit when image-size publishes a patched release; remove these entries then.
    - rule_id: 'GHSA-5p2g-fcmc-qvqq-image-size'
      path: 'docs/pnpm-lock.yaml'
      reason: 'No fix published — advisory records last_affected 2.0.2 with no fixed version, and 2.0.2 is the latest release. Build-time only (via @docusaurus/mdx-loader), parses images committed to this repo, absent from every runtime bundle; no untrusted input reaches the JXL/HEIF parsers.'
      expiration: '2026-11-30'
    - rule_id: 'GHSA-w3rx-r6r6-pgpr-image-size'
      path: 'docs/pnpm-lock.yaml'
      reason: 'No fix published — advisory records last_affected 2.0.2 with no fixed version, and 2.0.2 is the latest release. Build-time only (via @docusaurus/mdx-loader), parses images committed to this repo, absent from every runtime bundle; no untrusted input reaches the ICNS parser.'
      expiration: '2026-11-30'
    # uuid@8.3.2 — buffer bounds check in v3/v5/v6 when `buf` is provided (CVE-2026-41907, GHSA-w5hq-g745-h8pq).
    # Transitive via @docusaurus/core → webpack-dev-server → sockjs. sockjs calls uuidv4() without a
    # `buf` argument (node_modules/sockjs/lib/transport.js:37), so the bounds bug cannot be triggered.
    # Dev-server dependency only — not in any deployed artifact. Pinned by sockjs@0.3.24 at `uuid: ^8.3.2`.
    #
    # Unreachable by override: the advisory is fixed only in 11.1.1, 12.0.1 and 13.0.1, so there is
    # no patched 8.x for sockjs to accept, and forcing sockjs onto uuid 11+ crosses three majors.
    - rule_id: 'GHSA-w5hq-g745-h8pq-uuid'
      path: 'docs/pnpm-lock.yaml'
      reason: 'Not exploitable — sockjs calls uuid.v4() without the optional `buf` param that triggers the bounds bug. Dev-server only (webpack-dev-server transitive); not in shipped bundle. No patched 8.x exists (fixed only in 11.1.1/12.0.1/13.0.1), and sockjs@0.3.24 pins ^8.3.2.'
      expiration: '2026-11-30'
    - rule_id: 'CVE-2026-41907'
      path: 'docs/pnpm-lock.yaml'
      reason: 'Not exploitable — sockjs calls uuid.v4() without the optional `buf` param that triggers the bounds bug. Dev-server only (webpack-dev-server transitive); not in shipped bundle. No patched 8.x exists (fixed only in 11.1.1/12.0.1/13.0.1), and sockjs@0.3.24 pins ^8.3.2.'
      expiration: '2026-11-30'
    # Gemnasium emits a separate "duplicate advisory" rule-ID for the same uuid CVE — same rationale.
    - rule_id: 'Gemnasium-653adbcf-024c-4083-8ea9-79cbe44e84f0'
      path: 'docs/pnpm-lock.yaml'
      reason: 'Duplicate advisory for CVE-2026-41907 (uuid buffer bounds). Same rationale — sockjs calls uuid.v4() without the `buf` param; dev-server only.'
      expiration: '2026-11-30'
    # (Removed 2026-08-17 — nine superseded "safety net" entries whose packages are now on
    # patched versions, verified against the current lockfiles:
    #
    #   GHSA-f886-m6hf-6m8v-brace-expansion  docs         fixed in 1.1.13; now 1.1.18
    #   CVE-2026-6321, GHSA-q3j6-qgpj-74h6   docs         fixed in 3.1.1;  now fast-uri 4.1.2
    #   CVE-2026-41305, GHSA-qx2v-qp2m-jg93  web-client   fixed in 8.5.10; now postcss 8.5.26
    #   CVE-2026-44455, CVE-2026-44456       web-client   fixed in 4.12.16; now hono 4.12.27
    #   CVE-2026-42338                       web-client   fixed in 10.1.1; now ip-address 10.2.0
    #
    # A suppression kept past its fix is not free: it silently absorbs any FUTURE advisory that
    # happens to reuse the rule ID, and its stated reason rots. The brace-expansion entry had
    # already rotted into a false claim — "no fix available, 1.1.13 is the latest v1.x" — when
    # 1.1.13 was itself the fix, and 1.1.18 now exists. Regression is guarded where it belongs,
    # by version floors in package.json / pyproject.toml, not by a suppression.)
    # (Removed: lambda.yml, dynamodb.yml suppressions — templates deleted in tier consolidation)
    # Dockerfile USER directive — not applicable for Lambda container images.
    # Lambda runs inside its own execution sandbox; the container USER has no security impact.
    - rule_id: 'dockerfile.security.missing-user.missing-user'
      path: 'infra/containers/rest-lambda/Dockerfile'
      reason: 'Not applicable — Lambda container images run inside Lambda execution sandbox; USER directive has no security impact'
    # (Removed 2026-08-17: GHSA-37ch-88jc-xwx2-path-to-regexp — fixed in 0.1.13, and
    # docs/pnpm-lock.yaml carries 0.1.13. See the superseded-safety-net note above.)
    # Dockerfile HEALTHCHECK — not applicable for Lambda container images.
    # Lambda manages function health internally; Docker HEALTHCHECK is ignored by the Lambda runtime.
    - rule_id: 'CKV_DOCKER_2'
      path: 'infra/containers/rest-lambda/Dockerfile'
      reason: 'Not applicable — Lambda container images; Docker HEALTHCHECK is ignored by the Lambda runtime'
    # Dockerfile container user — not applicable for Lambda container images.
    # Lambda runs inside its own execution sandbox; the container user has no security impact.
    - rule_id: 'CKV_DOCKER_3'
      path: 'infra/containers/rest-lambda/Dockerfile'
      reason: 'Not applicable — Lambda container images run inside Lambda execution sandbox; container user has no security impact'
    # child_process in vite.config.ts — build-time only, called with hardcoded string literals ('version', 'sha').
    # No user input reaches execSync; no injection vector.
    - rule_id: 'javascript.lang.security.detect-child-process.detect-child-process'
      path: 'web-client/vite.config.ts'
      reason: 'False positive — build-time config only; execSync is called with hardcoded string literals, no user input'
    # Bandit B607: partial executable path for git — build utility script with hardcoded args, no user input.
    - rule_id: 'B607'
      path: 'infra/scripts/version.py'
      reason: 'Build utility calls git with hardcoded arguments (rev-parse --short=7 HEAD); no user input, FileNotFoundError already handled'
    # Bandit B404: subprocess import in build utility — calls git with hardcoded list args (no shell), no user input.
    - rule_id: 'B404'
      path: 'infra/scripts/version.py'
      reason: 'Build utility uses subprocess with list invocation (no shell) for git with hardcoded arguments; no user input'
    - rule_id: 'B603'
      path: 'infra/scripts/version.py'
      reason: 'Build utility calls git with hardcoded list arguments (no shell, no user input)'
    # (Removed: cloudfront.yml, s3.yml, apigateway-v2.yml suppressions — templates deleted in tier consolidation)
    # ========================================================================
    # Consolidated tier templates (frontend, backend, queue)
    # ========================================================================
    # --- frontend.yml (S3 + CloudFront + OAC) ---
    # S3 versioning — static web assets rebuilt from source
    - rule_id: 'CKV_AWS_21'
      path: 'infra/cfn/frontend/frontend.yml'
      reason: 'Out of scope for POC — static web assets are rebuilt from source; versioning adds storage cost with no recovery benefit. Customers can enable when productionizing.'
    - rule_id: 'CKV_AWS_21'
      path: 'infra/tf/frontend/main.tf'
      reason: 'Out of scope for POC — static web assets are rebuilt from source; versioning adds storage cost with no recovery benefit. Customers can add an aws_s3_bucket_versioning resource when productionizing. Mirrors CFN suppression on infra/cfn/frontend/frontend.yml.'
    # CloudFront TLS — false positive; MinimumProtocolVersion: TLSv1.2_2021 is set
    - rule_id: 'CKV_AWS_174'
      path: 'infra/cfn/frontend/frontend.yml'
      reason: 'False positive — ViewerCertificate.MinimumProtocolVersion is set to TLSv1.2_2021; checkov fails to detect it'
    # CloudFront WAF — out of scope for POC
    - rule_id: 'CKV_AWS_68'
      path: 'infra/cfn/frontend/frontend.yml'
      reason: 'Out of scope for POC — WAF requires a separate WebACL; customers can attach WebACLId when productionizing'
    # --- backend.yml (Lambda + API Gateway v2 + DynamoDB + CloudWatch) ---
    # CloudWatch Log Group KMS — out of scope for POC; backend has Lambda + API GW log groups
    - rule_id: 'CKV_AWS_158'
      path: 'infra/cfn/backend/backend.yml'
      reason: 'Out of scope for POC — CloudWatch Log Group uses default encryption; customers can add KmsKeyId when productionizing'
    # Lambda DLQ — Lambda is invoked synchronously via API Gateway
    - rule_id: 'CKV_AWS_116'
      path: 'infra/cfn/backend/backend.yml'
      reason: 'Not applicable — Lambda is invoked synchronously via API Gateway; DLQ only triggers on async invocations'
    # Lambda env var KMS — out of scope for POC
    - rule_id: 'CKV_AWS_173'
      path: 'infra/cfn/backend/backend.yml'
      reason: 'Out of scope for POC — Lambda env vars use default AWS-managed encryption; customers can add KmsKeyArn when productionizing'
    # Lambda VPC — out of scope for POC
    - rule_id: 'CKV_AWS_117'
      path: 'infra/cfn/backend/backend.yml'
      reason: 'Out of scope for POC — VPC configuration requires VPC, subnets, and security groups; customers can add VpcConfig when productionizing'
    # --- queue.yml (SQS + DLQ + worker Lambda + ESM + DynamoDB + CloudWatch) ---
    # SQS KMS encryption — queue and DLQ use SqsManagedSseEnabled (SSE-SQS) instead of CMK; out of scope for POC
    - rule_id: 'CKV_AWS_27'
      path: 'infra/cfn/queue/queue.yml'
      reason: 'Out of scope for POC — SQS uses SSE-SQS (SqsManagedSseEnabled: true); customers can add KMS CMK when productionizing'
    # CloudWatch Log Group KMS — out of scope for POC
    - rule_id: 'CKV_AWS_158'
      path: 'infra/cfn/queue/queue.yml'
      reason: 'Out of scope for POC — CloudWatch Log Group uses default encryption; customers can add KmsKeyId when productionizing'
    # Lambda DLQ — worker Lambda is invoked synchronously by SQS ESM; ESM handles retries and routes to SQS DLQ
    - rule_id: 'CKV_AWS_116'
      path: 'infra/cfn/queue/queue.yml'
      reason: 'Not applicable — worker Lambda is invoked synchronously by SQS Event Source Mapping; retries and DLQ routing handled by SQS, not Lambda DLQ'
    # Lambda DLQ — Terraform mirrors of the CFN tier templates. Same invocation
    # patterns; same rationale. Lambda DLQ (DeadLetterConfig) only triggers on
    # async invocations and is irrelevant for sync API Gateway and SQS ESM paths.
    - rule_id: 'CKV_AWS_116'
      path: 'infra/tf/backend/main.tf'
      reason: 'Not applicable — Lambda is invoked synchronously via API Gateway v2; DLQ only triggers on async invocations. Mirrors CFN suppression on infra/cfn/backend/backend.yml.'
    - rule_id: 'CKV_AWS_116'
      path: 'infra/tf/queue/main.tf'
      reason: 'Not applicable — worker Lambda is invoked synchronously by SQS Event Source Mapping; retries and DLQ routing handled by the SQS queue/DLQ pair, not Lambda DLQ. Mirrors CFN suppression on infra/cfn/queue/queue.yml.'
    # Lambda env var KMS — out of scope for POC
    - rule_id: 'CKV_AWS_173'
      path: 'infra/cfn/queue/queue.yml'
      reason: 'Out of scope for POC — Lambda env vars use default AWS-managed encryption; customers can add KmsKeyArn when productionizing'
    # Lambda VPC — out of scope for POC
    - rule_id: 'CKV_AWS_117'
      path: 'infra/cfn/queue/queue.yml'
      reason: 'Out of scope for POC — VPC configuration requires VPC, subnets, and security groups; customers can add VpcConfig when productionizing'
    # Lambda VPC — Terraform mirrors of the CFN tier templates; same rationale.
    - rule_id: 'CKV_AWS_117'
      path: 'infra/tf/backend/main.tf'
      reason: 'Out of scope for POC — VPC configuration requires VPC, subnets, and security groups; customers can add vpc_config when productionizing. Mirrors CFN suppression on infra/cfn/backend/backend.yml.'
    - rule_id: 'CKV_AWS_117'
      path: 'infra/tf/queue/main.tf'
      reason: 'Out of scope for POC — VPC configuration requires VPC, subnets, and security groups; customers can add vpc_config when productionizing. Mirrors CFN suppression on infra/cfn/queue/queue.yml.'
    # ========================================================================
    # CKV_AWS_45 — Lambda env vars contain no secrets; only literals are
    # configuration values (AWS_LWA_REMOVE_BASE_PATH: '/prod', APP_INVOKE_MODE: 'BUFFERED').
    # All sensitive values are injected via CloudFormation !Ref / !If at deploy time.
    # ========================================================================
    - rule_id: 'CKV_AWS_45'
      path: 'infra/cfn/backend/backend.yml'
      reason: 'False positive — no hardcoded secrets; env var literals are config values (path prefix, mode enum), sensitive values use !Ref/!If'
    - rule_id: 'CKV_AWS_45'
      path: 'infra/cfn/queue/queue.yml'
      reason: 'False positive — no hardcoded secrets; env var literals are config values (path prefix, mode enum), sensitive values use !Ref/!If'
    # lodash / lodash-es — FIXED in both docs/ and web-client/ via npm audit fix (2026-04-10)
    # ========================================================================
    # unsafe-formatstring — template literal in console.error, not a format string.
    # The component name is interpolated as data, not as a format specifier.
    # ========================================================================
    - rule_id: 'javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring'
      path: 'web-client/src/pages/sink/components/component-wrapper.tsx'
      reason: 'False positive — template literal in console.error; component name is data interpolation, not a format specifier'
    # dangerouslySetInnerHTML in shadcn/ui ChartStyle — injects scoped CSS custom properties
    # (theme colors) from developer-defined ChartConfig, not user input. Standard shadcn/ui pattern.
